<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>drumcopy 박·마디 편집</title>
<style>
/* Tokens: one small set, used everywhere below. */
:root{
  --win:#1c1d1f; --panel:#26272a; --panel-2:#2f3134; --raise:#383a3e;
  --lane:#202123; --lane-alt:#232427; --line:#36383c; --line-2:#4a4d52;
  --text:#e9eaec; --text-2:#a6aab0; --text-3:#70757c;
  --accent:#3d8bff; --cycle:#cda63a; --flag:#ea8a3f; --tempo:#a3d47f;
  --audio:#2a6594; --audio-hi:#4b93cb; --drum:#367f4c; --drum-hi:#63c27f;
  --r-s:4px; --r-m:6px; --r-l:9px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--win);color:var(--text);font:13px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-m);padding:4px 10px;cursor:pointer;line-height:18px}
button:hover{background:var(--raise)} button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:#244a7d;border-color:var(--accent);color:#fff}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=number]{font:inherit;color:var(--text);background:var(--lane);border:1px solid var(--line-2);border-radius:var(--r-s);padding:3px 6px;width:56px}
input[type=range]{accent-color:var(--accent)}
kbd{font:11px var(--f);color:var(--text-2);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:var(--r-s);padding:0 5px;background:var(--panel)}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}

/* Control bar */
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3);background:linear-gradient(#34363a,#2a2b2e);border-bottom:1px solid #111}
.grp{display:flex;align-items:center;gap:var(--s1)}
.icon{width:34px;height:28px;padding:0;display:grid;place-items:center}
.icon svg{width:16px;height:16px;fill:currentColor}
#play{width:40px}
#lcd{display:flex;align-items:stretch;background:#121315;border:1px solid #0a0a0b;border-radius:var(--r-m);box-shadow:inset 0 1px 0 #000,0 1px 0 #3c3e42;padding:3px 4px;margin:0 var(--s2)}
#lcd .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;border-left:1px solid #26282b;min-width:64px}
#lcd .cell:first-child{border-left:0}
#lcd b{font-size:21px;font-weight:500;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:#dfe9f3;line-height:24px}
#lcd small{font-size:10px;color:var(--text-3);line-height:12px}
#lcd .pos b span{display:inline-block;min-width:1.4em;text-align:right}
#lcd .status{min-width:150px;align-items:flex-start}
#status{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
#status i{width:7px;height:7px;border-radius:50%;background:#4caf6a;display:inline-block}
#status.busy i{background:var(--cycle);animation:pulse 1s infinite} #status.tap i{background:var(--flag)}
@keyframes pulse{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){#status.busy i{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-m);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel-2);padding:4px 9px}
.seg button+button{border-left:1px solid var(--line-2)} .seg button.on{background:#244a7d}
.spacer{flex:1}

/* Inspector + arrange */
#main{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:calc(100vh - 46px)}
#main.noinsp{grid-template-columns:0 minmax(0,1fr)} #main.noinsp #insp{display:none}
#insp{grid-row:1/span 2;position:sticky;top:46px;height:calc(100vh - 46px);background:var(--panel);border-right:1px solid #111;padding:var(--s3) var(--s3) var(--s4);overflow:auto}
#insp h2{font-size:13px;font-weight:600;margin:0 0 var(--s2)}
#insp h3{font-size:12px;font-weight:600;color:var(--text-2);margin:var(--s4) 0 var(--s2)}
#insp section+section{border-top:1px solid var(--line);margin-top:var(--s4);padding-top:var(--s3)}
.tip{padding:7px 0}
.tip b{display:block;font-weight:600;color:var(--text)} .tip span{color:var(--text-2)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips button{padding:3px 8px;font-size:12px}
.flag{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--flag);border-radius:0;padding:6px 8px;margin:4px 0;color:var(--text)}
.flag:hover{background:var(--panel-2)} .flag small{display:block;color:var(--text-2)}
#arr{min-width:0;background:var(--win)}
#arrhead{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s3);border-bottom:1px solid #111;background:var(--panel)}
#songbtn{font-size:13px;font-weight:600;background:none;border:1px solid transparent;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#songbtn:hover{border-color:var(--line-2);background:var(--panel-2)}
.songs{max-height:50vh;overflow:auto;margin:6px 0}
.songs button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:7px 4px}
.songs button:hover{background:var(--raise)} .songs button.on{background:#244a7d}
.songs small{display:block;color:var(--text-2);font-weight:400}
.pop.wide{max-width:560px;min-width:440px}
#rootpath{flex:1;font:inherit;color:var(--text);background:var(--lane);border:1px solid var(--line-2);border-radius:var(--r-s);padding:3px 6px}
canvas{display:block;width:100%}
#ov{height:18px;cursor:pointer;background:#161718;border-bottom:1px solid #111}
#tl{height:314px;touch-action:none}
#keys{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px var(--s3);color:var(--text-3);font-size:12px;border-top:1px solid #111;background:var(--panel)}

/* Bottom editor */
#editor{grid-column:2;border-top:1px solid #000;background:var(--panel)}
#tabs{display:flex;gap:2px;padding:6px var(--s3) 0;border-bottom:1px solid var(--line)}
#tabs button{border:0;border-radius:var(--r-m) var(--r-m) 0 0;background:none;color:var(--text-2);padding:6px 12px}
#tabs button.on{background:var(--panel-2);color:var(--text)}
.pane{padding:var(--s3)} .pane[hidden]{display:none}
#pageimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:var(--s3);margin-top:var(--s3)}
#pageimgs img{width:100%;border-radius:var(--r-s);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.entry{display:flex;gap:var(--s2);align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.entry .grow{flex:1} .entry .x{background:none;border:1px solid transparent;color:var(--text-3);font-size:12px;padding:2px 8px}
.entry .x:hover{color:var(--text);border-color:var(--line-2)}
.src{font-size:11px;border-radius:var(--r-s);padding:0 5px;margin-right:6px;background:#244a7d;color:#cfe0ff}
.src.score{background:#3d3560;color:#ddd2ff}

/* Popover and toast */
.pop{position:fixed;z-index:20;min-width:240px;max-width:340px;background:#2c2e31;border:1px solid #4a4d52;border-radius:var(--r-l);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:var(--s3)}
.pop h4{margin:0 0 var(--s2);font-size:13px;font-weight:600}
.pop .row+.row{margin-top:var(--s2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f2f3f5;color:#16181b;padding:8px 14px;border-radius:var(--r-m);display:none;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (max-width:900px){#main{grid-template-columns:minmax(0,1fr)} #insp{grid-row:auto;position:static;height:auto;border-right:0;border-bottom:1px solid #111} #editor{grid-column:1} #lcd .cell.time,#lcd .status{display:none}}
</style></head><body>
<header id="bar">
  <div class="grp">
    <button class="icon" id="insbtn" title="인스펙터 보기/숨기기 (I)"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="3.5" width="4" height="9"/></svg></button>
  </div>
  <div class="grp">
    <button class="icon" id="tostart" title="처음으로 (Return)"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="2" height="10"/><path d="M14 3v10L5 8z"/></svg></button>
    <button class="icon" id="play" title="재생/정지 (Space)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11L13.5 8z"/></svg></button>
    <button class="icon" id="cycle" title="선택 구간 반복 (C)"><svg viewBox="0 0 16 16"><path d="M3 6a4 4 0 0 1 7-2.6V2h2v5H7V5h2.2A2.5 2.5 0 0 0 4.5 6H3zm10 4a4 4 0 0 1-7 2.6V14H4V9h5v2H6.8a2.5 2.5 0 0 0 4.7-1H13z"/></svg></button>
    <button class="icon on" id="click" title="메트로놈 클릭 (K)"><svg viewBox="0 0 16 16"><path d="M6 1h4l3.5 14h-11zM7.2 3l-.6 2.5h2.8L8.8 3zM5 13h6l-.9-4H5.9z"/><path d="M8 10l4.5-6" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <div id="lcd">
    <div class="cell pos"><b><span id="lcdBar">1</span>&nbsp;<span id="lcdBeat">1</span></b><small>마디&nbsp;&nbsp;박</small></div>
    <div class="cell"><b id="lcdTempo">-</b><small>템포</small></div>
    <div class="cell"><b id="lcdSig">4/4</b><small>박자</small></div>
    <div class="cell time"><b id="lcdTime">0:00.0</b><small>시간</small></div>
    <div class="cell status"><span id="status"><i></i><span id="statusText">불러오는 중</span></span><small id="statusSub"></small></div>
  </div>
  <div class="grp">
    <button id="tapbtn" title="탭으로 박 입력 (T)">탭</button>
  </div>
  <div class="grp">
    <div class="seg" id="srcseg" title="들을 소리"><button data-src="mix" class="on">원곡</button><button data-src="drums">드럼만</button></div>
    <div class="seg" id="rateseg" title="재생 속도"><button data-rate="1" class="on">1×</button><button data-rate="0.75">0.75×</button><button data-rate="0.5">0.5×</button></div>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <button id="undo" title="마지막 수정 되돌리기 (⌘Z / Ctrl+Z)">되돌리기</button>
    <button class="icon" id="settings" title="클릭 음량, 입력 지연"><svg viewBox="0 0 16 16"><path d="M8 5.2A2.8 2.8 0 1 0 8 10.8 2.8 2.8 0 0 0 8 5.2zm6.3 3.7-1.3.3a5 5 0 0 1-.5 1.2l.7 1.1-1.4 1.4-1.1-.7a5 5 0 0 1-1.2.5l-.3 1.3H7.2l-.3-1.3a5 5 0 0 1-1.2-.5l-1.1.7-1.4-1.4.7-1.1a5 5 0 0 1-.5-1.2l-1.3-.3V7.1l1.3-.3c.1-.4.3-.8.5-1.2l-.7-1.1 1.4-1.4 1.1.7c.4-.2.8-.4 1.2-.5l.3-1.3h2l.3 1.3c.4.1.8.3 1.2.5l1.1-.7 1.4 1.4-.7 1.1c.2.4.4.8.5 1.2l1.3.3z"/></svg></button>
  </div>
</header>
<div id="main">
  <aside id="insp"></aside>
  <section id="arr">
    <div id="arrhead"><button id="songbtn" title="다른 곡이나 작업 폴더 고르기"><span id="title">drumcopy</span> <span class="faint">▾ 곡 바꾸기</span></button><span class="spacer"></span>
      <button class="icon" id="zout" title="축소 (−)">−</button><button class="icon" id="zin" title="확대 (+)">+</button><button id="zfit" title="곡 전체 보기">전체</button></div>
    <canvas id="ov"></canvas>
    <canvas id="tl"></canvas>
    <div id="keys"><span><kbd>Space</kbd> 재생</span><span>재생 위치: 흰 선을 끌거나 눈금자 아래쪽 클릭</span><span>구간 선택: 눈금자 위쪽을 끌기</span><span><kbd>C</kbd> 구간 반복</span><span><kbd>K</kbd> 클릭</span><span><kbd>T</kbd> 탭, 탭 중에는 <kbd>F</kbd> 마디 첫 박 <kbd>J</kbd> 박 (F만 치면 첫 박만 맞춤)</span><span><kbd>←</kbd><kbd>→</kbd> 고른 박이나 구간을 10ms 밀기(<kbd>Shift</kbd> 50ms)</span><span><kbd>D</kbd> 고른 박을 마디 첫 박으로</span><span><kbd>⌘Z</kbd> 되돌리기</span><span>휠로 이동, <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+휠로 확대</span></div>
  </section>
<section id="editor">
  <div id="tabs"><button data-tab="score" class="on">악보</button><button data-tab="log">수정 기록 <span id="logcount"></span></button></div>
  <div class="pane" id="pane-score"><div class="row"><button id="render">PDF 다시 만들기</button><a href="/score.pdf" target="_blank" style="color:var(--accent)">PDF 열기</a>
    <span class="faint">내려받기</span><a href="/score.mxl" download="score.mxl" style="color:var(--accent)" title="시벨리우스, Dorico, Finale, MuseScore에서 열기">MXL (시벨리우스 등)</a>
    <a href="/score.mscz" download="score.mscz" style="color:var(--accent)" title="MuseScore 원본 파일">MuseScore</a>
    <a href="/score.mid" download="score.mid" style="color:var(--accent)">MIDI</a><span class="muted" id="pagenote"></span></div><div id="pageimgs"></div></div>
  <div class="pane" id="pane-log" hidden><div id="log"></div></div>
</section>
</div>
<div class="pop" id="pop" hidden></div><div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const tl = $('tl'), ov = $('ov');
const G = 120, H = 314;  // track header width, arrange height (CSS px)
const ROW = {ruler: [0, 26], marker: [26, 48], sig: [48, 72], tempo: [72, 128], audio: [128, 236], drum: [236, 314]};
const SIGS = ['2/4', '3/4', '4/4', '5/4', '6/4', '6/8', '9/8', '12/8'];
const MARKS = ['rit.', 'accel.', 'a tempo', 'rubato', 'poco rit.', 'poco accel.', 'rall.'];
const KINDS = {span: '마디 수·박자표', beats: '탭한 박', downbeat: '마디 첫 박', tempo: '템포 표기', meter: '박자표', move: '박 위치', shift: '구간 밀기'};
const C = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let S = null, pagesStale = false;
let view = {t0: 0, pps: 40};
let sel = null, cycleOn = false, selBeat = null;        // sel: cycle range {a, b}; selBeat: time of the chosen beat
let tap = null, cal = null, drag = null, hover = null, nudge = null;
let latency = +(localStorage.getItem('drumcopy.latency') || 0);
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const master = ctx.createGain(); master.connect(ctx.destination);
const clickGain = ctx.createGain(); clickGain.gain.value = +(localStorage.getItem('drumcopy.click') || 0.5); clickGain.connect(ctx.destination);
const buffers = {}; let srcName = 'mix', rate = 1, clickOn = true, play = null, pos = 0, timer = null, schedUpTo = 0;
if (new URLSearchParams(location.search).has('mute')) { master.gain.value = 0; clickGain.gain.value = 0; }  // automated checks stay silent

// ---------------------------------------------------------------- helpers
const r3 = t => Math.round(t * 1000) / 1000;
const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
const markText = m => /^\d+$/.test(m) ? '♩=' + m : m === '-' ? '표기 없음' : m;
function toast(text, ms = 2400) { const el = $('toast'); el.textContent = text; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', ms); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
const X = t => G + (t - view.t0) * view.pps;
const T = x => view.t0 + (x - G) / view.pps;
function barAt(t) { let i = -1; for (let k = 0; k < S.bars.length; k++) if (S.bars[k].t <= t + 1e-3) i = k; return i; }
function nearestBeat(t) { const b = S.beats; let lo = 0, hi = b.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (b[m] < t) lo = m; else hi = m; } return Math.abs(b[lo] - t) <= Math.abs(b[hi] - t) ? lo : hi; }
function beatName(t) { const i = barAt(t); if (i < 0) return fmt(t); const bar = S.bars[i], k = nearestBeat(t); return `${bar.n}마디 ${k - bar.k + 1}박`; }
const isDown = t => S.bars.some(b => Math.abs(b.t - t) < 0.002);
function barTempo(i) { const b = S.bars[i]; return b ? Math.round(60 / ((b.end - b.t) / b.beats)) : null; }

// ---------------------------------------------------------------- saving (every edit is saved at once; ⌘Z takes it back)
let queue = Promise.resolve(), inflight = 0;
function setStatus(kind, text, sub = '') { $('status').className = kind; $('statusText').textContent = text; $('statusSub').textContent = sub; }
function save(add = [], remove = [], done = '저장했습니다') {
  inflight++; setStatus('busy', '다시 채보하는 중');
  queue = queue.then(async () => {
    try {
      const res = await fetch('/api/apply', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({add, remove})});
      const data = await res.json();
      if (!res.ok) { toast('저장하지 못했습니다: ' + (data.message || data.error), 5000); return; }
      S = data; pagesStale = true; renderAll(); if (done) toast(done);
    } catch (e) { toast('drumcopy tune 서버에 연결할 수 없습니다. 터미널에서 서버가 켜져 있는지 확인하세요.', 6000); }
  }).finally(() => { if (--inflight === 0) setStatus('', '저장됨', `${S.bars.length}마디`); });
  return queue;
}
function undo() {
  const mine = S.entries.filter(e => KINDS[e.kind]).sort((a, b) => String(a.added).localeCompare(String(b.added)));
  const e = mine[mine.length - 1];
  if (!e) return toast('되돌릴 수정이 없습니다');
  save([], [{time: e.time, kind: e.kind}], `되돌렸습니다: ${describe(e)}`);
}
function barRange(a, z) {
  // Bar numbers as the score prints them now, for a stretch of the recording.
  const i = barAt(a + 0.01), j = z == null ? i : Math.max(i, barAt(z - 0.01));
  if (i < 0) return '곡 시작 전';
  return i === j ? `${S.bars[i].n}마디` : `${S.bars[i].n}~${S.bars[j].n}마디`;
}
const earlyLate = ms => `${Math.abs(ms)}ms ${ms > 0 ? '늦게' : '일찍'}`;
function describe(e) {
  // One plain sentence about the music, in the bar numbers the user sees.
  const where = barRange(e.time, e.end);
  if (e.kind === 'span' && e.end == null) return `${where}부터 ${e.bars}마디를 ${e.signature} 박자로`;
  if (e.kind === 'span' && e.bars) {
    // Counted from its first bar: the end may have moved since (the next bar's first beat dragged).
    const i = barAt(e.time + 0.01), n = i >= 0 ? S.bars[i].n : 1;
    return `${e.bars > 1 ? `${n}~${n + e.bars - 1}마디` : `${n}마디`}를 ${e.signature} 박자 ${e.bars}마디로 맞춤`;
  }
  if (e.kind === 'span') return `${where}를 ${e.signature} 박자로 묶음`;
  if (e.kind === 'meter') return `${where}부터 ${e.bars}마디를 ${e.beats}/4 박자로`;
  if (e.kind === 'tempo') { const m = String(e.mark); return m === '-' ? `${where}의 템포 표기를 뺌` : `${where}에 ${markText(m)} 표기`; }
  if (e.kind === 'move') return `${beatName(e.to)}을 ${earlyLate(Math.round((e.to - e.time) * 1000))}`;
  if (e.kind === 'shift') return `${where}의 박을 모두 ${earlyLate(e.ms)}`;

  // Beats between consecutive bar first beats (and the range ends) at equal spacing; the
  // anchors stay. Saved as moved beats only: the bar lines do not change.
  const ks = S.beats.map((t, k) => k).filter(k => S.beats[k] >= a - 1e-3 && S.beats[k] <= b + 1e-3);
  if (ks.length < 3) return toast('박이 세 개 이상인 구간을 고르세요');
  const anchors = ks.filter((k, i) => i === 0 || i === ks.length - 1 || isDown(S.beats[k]));
  const times = ks.map(k => S.beats[k]);
  for (let j = 0; j + 1 < anchors.length; j++) {
    const k0 = anchors[j], k1 = anchors[j + 1], t0 = S.beats[k0], t1 = S.beats[k1];
    for (let k = k0 + 1; k < k1; k++) times[k - ks[0]] = t0 + (t1 - t0) * (k - k0) / (k1 - k0);
  }
  if (times.every((t, i) => Math.abs(t - S.beats[ks[i]]) < 0.001)) return toast('이미 고르게 놓여 있습니다');
  save([{kind: 'beats', times: times.map(r3), downbeats: null, note: '박 고르게 펴기'}], [], `${barRange(a, b)}의 박을 고르게 폈습니다`);
}

function moveBeat(from, to) {
  // A beat moved before keeps one entry, from its first place: dragging it again edits that
  // entry, dragging it home removes it.
  const earlier = S.entries.find(e => e.kind === 'move' && Math.abs(e.to - from) < 0.002);
  const home = earlier ? earlier.time : from, ms = Math.round((to - home) * 1000);
  if (earlier && Math.abs(ms) < 3) return save([], [{time: earlier.time, kind: 'move'}], `${beatName(from)}을 원래 자리로 돌렸습니다`);
  save([{kind: 'move', time: r3(home), to: r3(to)}], [], `${beatName(from)}을 원래보다 ${earlyLate(ms)} 놓았습니다`);
}

// nudges: arrows move the chosen beat (or the cycle range) and are saved after a short pause
function nudgeBy(ms) {
  if (selBeat === null && !sel) return false;
  if (!nudge) nudge = selBeat !== null ? {beat: selBeat, times: [selBeat], ms: 0} : {a: sel.a, b: sel.b, times: S.beats.filter(t => t >= sel.a - 1e-3 && t < sel.b - 1e-3), ms: 0};
  nudge.ms += ms; clearTimeout(nudge.timer); nudge.timer = setTimeout(flushNudge, 700);
  setStatus('busy', `${nudge.ms > 0 ? '+' : ''}${nudge.ms}ms`, '잠시 뒤 저장'); draw(); return true;
}
function flushNudge() {
  if (!nudge) return; const n = nudge; nudge = null; clearTimeout(n.timer);
  if (!n.ms) return draw();
  if (n.beat !== undefined) { moveBeat(n.beat, n.beat + n.ms / 1000); selBeat = r3(n.beat + n.ms / 1000); }
  else { save([{kind: 'shift', time: r3(n.a), end: r3(n.b - 1e-3), ms: n.ms}], [], `구간 박을 ${n.ms > 0 ? '+' : ''}${n.ms}ms 밀었습니다`); sel = {a: n.a + n.ms / 1000, b: n.b + n.ms / 1000}; }
}

// ---------------------------------------------------------------- buttons and keys
document.addEventListener('click', ev => {
  const el = ev.target.closest('button'); if (!el) { if (!ev.target.closest('#pop') && !ev.target.closest('#tl')) closePop(); return; }
  el.blur();  // Space must play/stop, not press the last clicked button again
  const ds = el.dataset;
  if (ds.sig) { document.querySelectorAll('#sigchips button').forEach(b => b.classList.toggle('on', b === el)); }
  else if (ds.psig) { document.querySelectorAll('#psig button').forEach(b => b.classList.toggle('on', b === el)); }
  else if (ds.act === 'span') { const n = +$('nbars').value, sig = document.querySelector('#sigchips .on').dataset.sig; if (n >= 1) save([{kind: 'span', time: r3(sel.a), end: r3(sel.b), bars: n, signature: sig}], [], `${n}마디 ${sig}로 저장했습니다`); }
  else if (ds.act === 'tap') startTap();
  else if (ds.act === 'even') evenOut(sel.a, sel.b);
  else if (ds.act === 'cycleplay') { cycleOn = true; $('cycle').classList.add('on'); startPlay(sel.a); renderInspector(); }
  else if (ds.act === 'downbeat') markDownbeat();
  else if (ds.nudge) nudgeBy(+ds.nudge);
  else if (ds.shift) nudgeBy(+ds.shift);
  else if (ds.flag) goFlag(S.flags[+ds.flag]);
  else if (ds.item) { const it = logItems()[+ds.item]; if (it) save([], it.entries.map(e => ({time: e.time, kind: e.kind})), `지웠습니다: ${it.entries.length > 1 ? barRange(it.start, it.end) + '의 박 위치 수정' : describe(it.entries[0])}`); }
  else if (ds.pop === 'close') closePop();
  else if (ds.pop === 'sig') {
    const i0 = +ds.i0, i1 = +ds.i1, sig = document.querySelector('#psig .on').dataset.psig, a = S.bars[i0];
    if (i0 === i1) { const n = Math.max(1, +$('pcount').value || 1); save([{kind: 'span', time: r3(a.t), end: null, bars: n, signature: sig}], [], `${a.n}마디부터 ${n}마디를 ${sig}로 저장했습니다`); }
    else { const n = Math.max(1, +$('pbars').value || 1), z = S.bars[i1]; save([{kind: 'span', time: r3(a.t), end: r3(z.end), bars: n, signature: sig}], [], `${a.n}–${z.n}마디를 ${n}마디 ${sig}로 저장했습니다`); }
    closePop();
  }
  else if (ds.pmark) { const b = S.bars[+ds.i], mark = ds.pmark === 'bpm' ? String(+$('pbpm').value) : ds.pmark; save([{kind: 'tempo', time: r3(b.t), mark}], [], `${b.n}마디 템포 표기: ${markText(mark)}`); closePop(); }
  else if (ds.src) { srcName = ds.src; document.querySelectorAll('#srcseg button').forEach(b => b.classList.toggle('on', b === el)); const t = audioNow(); if (play) startPlay(t, play.until); else loadAudio(srcName).catch(e => toast(String(e.message || e))); }
  else if (ds.rate) { rate = +ds.rate; document.querySelectorAll('#rateseg button').forEach(b => b.classList.toggle('on', b === el)); if (play) startPlay(audioNow(), play.until); }
  else if (ds.tab) { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === el)); $('pane-score').hidden = ds.tab !== 'score'; $('pane-log').hidden = ds.tab !== 'log'; }
  else if (ds.cal !== undefined) calibrate();
  else if (ds.lat) { latency += +ds.lat; localStorage.setItem('drumcopy.latency', latency); $('latv').textContent = latency; }
});
function markDownbeat() { if (selBeat === null) return toast('먼저 원곡 트랙에서 박 선을 클릭해 고르세요'); save([{kind: 'downbeat', time: r3(selBeat)}], [], `${beatName(selBeat)}에서 마디가 시작합니다`); }
$('play').onclick = togglePlay;
$('tostart').onclick = () => { stopPlay(false); pos = 0; view.t0 = 0; draw(); };
$('cycle').onclick = () => { cycleOn = !cycleOn; $('cycle').classList.toggle('on', cycleOn); if (cycleOn && !sel) toast('눈금자를 끌어 반복할 구간을 고르세요'); renderInspector(); draw(); };
$('click').onclick = () => { clickOn = !clickOn; $('click').classList.toggle('on', clickOn); };
$('tapbtn').onclick = () => tap ? endTap() : startTap();
$('undo').onclick = undo;
$('insbtn').onclick = () => { $('main').classList.toggle('noinsp'); draw(); };
$('zin').onclick = () => zoom(1.25, view.t0 + (tl.clientWidth - G) / view.pps / 2);
$('zout').onclick = () => zoom(0.8, view.t0 + (tl.clientWidth - G) / view.pps / 2);
$('zfit').onclick = () => { const dur = buffers[srcName] ? buffers[srcName].duration : S.beats[S.beats.length - 1] + 2; view.pps = (tl.clientWidth - G) / dur; view.t0 = 0; draw(); };
$('settings').onclick = ev => { const r = ev.currentTarget.getBoundingClientRect(); openPop(r.right - 300, r.bottom - 4, `<h4>클릭과 입력 지연</h4>
  <div class="row">클릭 음량 <input type="range" min="0" max="1" step="0.05" value="${clickGain.gain.value}" id="pvol" style="flex:1"></div>
  <div class="row">입력 지연 <b id="latv">${latency}</b>ms <button data-lat="-5">−5</button><button data-lat="5">+5</button></div>
  <div class="row"><button class="primary" data-cal>지연 맞추기</button></div>
  <div class="faint" style="margin-top:6px">클릭 16번이 울립니다. 클릭에 맞춰 J를 누르면 탭이 늦게 찍히는 만큼을 재서 이후 탭에서 뺍니다.</div>`);
  $('pvol').oninput = e => { clickGain.gain.value = +e.target.value; localStorage.setItem('drumcopy.click', e.target.value); }; };
$('render').onclick = async () => {
  setStatus('busy', 'PDF 만드는 중');
  try { const res = await fetch('/api/render', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}); const r = await res.json();
    if (!res.ok) throw new Error(r.message || r.error); S.pages = r.pages; S.stamp = r.stamp; pagesStale = false; renderPages(); toast('PDF를 다시 만들었습니다'); }
  catch (e) { toast('PDF를 만들지 못했습니다: ' + (e.message || e), 6000); }
  finally { setStatus('', '저장됨', `${S.bars.length}마디`); }
};
window.addEventListener('resize', draw);
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.matches && ev.target.matches('input, select, textarea')) { if (ev.key === 'Escape') closePop(); return; }
  const k = ev.key.toLowerCase();
  if (cal && (k === 'j' || k === 'f')) { cal.taps.push(heardCtx(ev)); return; }
  if (tap && (k === 'f' || k === 'j')) { ev.preventDefault(); if (!ev.repeat) tapKey(ev, k === 'f'); return; }
  if ((ev.metaKey || ev.ctrlKey) && k === 'z') { ev.preventDefault(); return undo(); }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (k === ' ') { ev.preventDefault(); togglePlay(); }
  else if (k === 't') { if (ev.repeat || (tap && performance.now() - tap.started < 500)) return; tap ? endTap() : startTap(); }
  else if (k === 'c') $('cycle').click();
  else if (k === 'k') $('click').click();
  else if (k === 'i') $('insbtn').click();
  else if (k === 'd') markDownbeat();
  else if (k === 'enter') $('tostart').click();
  else if (k === 'escape') { if (tap) endTap(true); else { closePop(); sel = null; selBeat = null; renderInspector(); draw(); } }
  else if (k === '+' || k === '=') $('zin').click();
  else if (k === '-') $('zout').click();
  else if (k === 'arrowleft' || k === 'arrowright') {
    ev.preventDefault(); const ms = (k === 'arrowleft' ? -1 : 1) * (ev.shiftKey ? 50 : 10);
    if (!nudgeBy(ms)) { const i = Math.max(0, barAt(audioNow()) + (k === 'arrowleft' ? -1 : 1)); pos = S.bars[Math.min(i, S.bars.length - 1)].t; if (play) startPlay(pos, null); else draw(); }
  }
});

async function songPop() {
  let data;
  try { data = await (await fetch('/api/songs')).json(); } catch (e) { return toast('곡 목록을 불러오지 못했습니다'); }
  const r = $('songbtn').getBoundingClientRect();
  const when = t => { const d = new Date(t * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  openPop(r.left + 20, r.bottom - 4, `<h4>곡 고르기</h4>
    <div class="songs">${data.songs.map(x => `<button data-song="${esc(x.song)}" class="${x.song === data.song ? 'on' : ''}">${esc(x.title)}<small>${x.measures ?? '?'}마디, 수정 ${x.corrections}건, ${when(x.changed)}에 바꿈</small></button>`).join('') || '<div class="muted">이 폴더에는 채보한 곡이 없습니다.</div>'}</div>
    <h4 style="margin-top:10px">작업 폴더</h4>
    <div class="row"><input id="rootpath" value="${esc(data.root)}" spellcheck="false"><button data-root>열기</button></div>
    <div class="faint" style="margin-top:6px">곡마다 하위 폴더 하나(score.txt, report.json이 있는 폴더)가 있는 폴더를 지정합니다.</div>`);
  document.querySelector('#pop').classList.add('wide');
}
async function openSong(body) {
  stopPlay(); if (tap) endTap(true); closePop();
  setStatus('busy', '곡을 여는 중');
  try {
    const res = await fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) { toast('열지 못했습니다: ' + (data.message || data.error), 6000); setStatus('', '준비됨', `${S.bars.length}마디`); return; }
    for (const k of Object.keys(buffers)) delete buffers[k];
    S = data; pagesStale = false; sel = null; selBeat = null; pos = 0; nudge = null;
    view.t0 = 0; view.pps = Math.max(8, (tl.clientWidth - G) / 30);
    if (S.flags.length) view.t0 = Math.max(0, S.flags[0].t - 2);
    document.title = `drumcopy · ${S.title}`;
    renderAll(); setStatus('', '준비됨', `${S.bars.length}마디`);
    loadAudio(srcName).catch(e => toast('소리를 불러오지 못했습니다: ' + (e.message || e), 6000));
    toast(`${S.title}을(를) 열었습니다`);
  } catch (e) { toast('서버에 연결할 수 없습니다: ' + e, 6000); }
}
$('songbtn').onclick = songPop;
document.addEventListener('click', ev => {
  const el = ev.target.closest('#pop button'); if (!el) return;
  if (el.dataset.song !== undefined) openSong({song: el.dataset.song});
  else if (el.dataset.root !== undefined) openSong({root: $('rootpath').value.trim()});
});

(async () => {
  try { S = await (await fetch('/api/state')).json(); }
  catch (e) { setStatus('', '서버 없음'); return toast('drumcopy tune 서버에 연결할 수 없습니다', 8000); }
  setStatus('', '준비됨', `${S.bars.length}마디`);
  view.pps = Math.max(8, (tl.clientWidth - G) / 30);
  if (S.flags.length) view.t0 = Math.max(0, S.flags[0].t - 2);
  renderAll();
  loadAudio('mix').catch(e => toast('원곡 소리를 불러오지 못했습니다: ' + (e.message || e), 6000));
})();
</script></body></html>
